<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SushiKris — Handcrafted Sushi</title>
<style>
  :root{
    --bg: #0e0e10;
    --bg-card: #17171a;
    --border: #2a2a2e;
    --text: #f4f2ee;
    --text-dim: #9a9a9f;
    --accent: #ff7a3d;
    --accent-dark: #d9642e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height:1.5;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 32px;}

  /* Header */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(14,14,16,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 0;
  }
  .logo{
    font-size:22px;font-weight:700;letter-spacing:-0.02em;
    display:flex;align-items:center;gap:8px;
  }
  .logo span{color:var(--accent);}
  .nav-links{display:flex;gap:34px;font-size:15px;color:var(--text-dim);}
  .nav-links a{transition:color .2s;}
  .nav-links a:hover, .nav-links a.active{color:var(--text);}
  .btn{
    display:inline-block;
    padding:11px 24px;
    border-radius:8px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent);color:#161616;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent;border-color:#3a3a3e;color:var(--text);}
  .btn-ghost:hover{border-color:var(--text-dim);}

  /* Hero */
  .hero{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:40px;
    padding:80px 0 60px;
  }
  .hero h1{
    font-size:52px;
    font-weight:700;
    letter-spacing:-0.02em;
    line-height:1.08;
    margin-bottom:20px;
  }
  .hero p{
    color:var(--text-dim);
    font-size:16.5px;
    max-width:420px;
    margin-bottom:32px;
  }
  .hero-ctas{display:flex;gap:14px;}

  .hero-visual{
    position:relative;
    height:460px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stack-item{
    position:absolute;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    animation: float 6s ease-in-out infinite;
  }
  .stack-item img{width:100%;height:100%;object-fit:cover;}
  .stack-1{width:230px;height:150px;top:0;right:40px;animation-delay:0s;z-index:3;transform:rotate(-4deg);}
  .stack-2{width:190px;height:190px;top:150px;left:20px;animation-delay:1.2s;z-index:2;transform:rotate(3deg);}
  .stack-3{width:210px;height:130px;bottom:30px;right:70px;animation-delay:2.4s;z-index:1;transform:rotate(-2deg);}

  @keyframes float{
    0%,100%{transform:translateY(0) rotate(var(--r,0deg));}
    50%{transform:translateY(-16px) rotate(var(--r,0deg));}
  }
  .stack-1{--r:-4deg;}
  .stack-2{--r:3deg;}
  .stack-3{--r:-2deg;}

  @media (prefers-reduced-motion: reduce){
    .stack-item{animation:none;}
  }

  /* Popular Rolls */
  .rolls-section{padding:50px 0 100px;}
  .rolls-header{
    display:flex;align-items:flex-end;justify-content:space-between;
    margin-bottom:28px;
  }
  .rolls-header h2{font-size:28px;font-weight:700;}
  .rolls-nav{display:flex;gap:10px;}
  .rolls-nav button{
    width:38px;height:38px;border-radius:50%;
    background:var(--bg-card);border:1px solid var(--border);
    color:var(--text);font-size:16px;cursor:pointer;
    transition:background .2s;
  }
  .rolls-nav button:hover{background:#212124;}

  .rolls-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
  }
  .roll-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:12px;
    cursor:pointer;
    transition:border-color .2s ease, transform .2s ease;
  }
  .roll-card:hover{transform:translateY(-4px);}
  .roll-card.selected{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent);
  }
  .roll-card .thumb{
    width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;margin-bottom:12px;
  }
  .roll-card .thumb img{width:100%;height:100%;object-fit:cover;}
  .roll-card h3{font-size:15.5px;font-weight:600;margin-bottom:4px;}
  .roll-card .price{color:var(--accent);font-weight:600;font-size:14px;}

  /* Detail panel */
  .roll-detail{
    margin-top:32px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px 32px;
    display:grid;
    grid-template-columns:120px 1fr auto;
    align-items:center;
    gap:26px;
    transition:opacity .25s ease;
  }
  .roll-detail .detail-thumb{
    width:120px;height:120px;border-radius:14px;overflow:hidden;
  }
  .roll-detail .detail-thumb img{width:100%;height:100%;object-fit:cover;}
  .roll-detail h4{font-size:19px;font-weight:700;margin-bottom:6px;}
  .roll-detail p{color:var(--text-dim);font-size:14.5px;max-width:460px;}
  .roll-detail .detail-price{font-size:26px;font-weight:700;color:var(--accent);white-space:nowrap;}

  footer{
    border-top:1px solid var(--border);
    padding:26px 0;
    text-align:center;
    color:var(--text-dim);
    font-size:13.5px;
  }

  @media (max-width: 880px){
    .hero{grid-template-columns:1fr;padding-top:40px;}
    .hero h1{font-size:38px;}
    .hero-visual{height:320px;margin-top:20px;}
    .nav-links{display:none;}
    .rolls-grid{grid-template-columns:repeat(2,1fr);}
    .roll-detail{grid-template-columns:80px 1fr;grid-template-rows:auto auto;}
    .roll-detail .detail-price{grid-column:2;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="logo">Sushi<span>Kris</span></div>
    <nav class="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#rolls">Menu</a>
      <a href="#">Recipes</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
    <a href="#" class="btn btn-primary">Order Online</a>
  </div>
</header>

<section class="hero wrap">
  <div>
    <h1>Fresh Sushi Art<br>in Every Bite</h1>
    <p>We blend tradition, creativity and only the freshest ingredients so every roll is a small work of art.</p>
    <div class="hero-ctas">
      <a href="#rolls" class="btn btn-primary">Explore Menu</a>
      <a href="#" class="btn btn-ghost">Learn More</a>
    </div>
  </div>

  <div class="hero-visual">
    <div class="stack-item stack-1">
      <img src="https://images.unsplash.com/photo-1584583570840-0a3d88497e08?auto=format&fit=crop&w=400&q=80" alt="Salmon nigiri">
    </div>
    <div class="stack-item stack-2">
      <img src="https://images.unsplash.com/photo-1617196034183-421b4917c92d?auto=format&fit=crop&w=400&q=80" alt="Rice">
    </div>
    <div class="stack-item stack-3">
      <img src="https://images.unsplash.com/photo-1611143669185-af224c5e3252?auto=format&fit=crop&w=400&q=80" alt="Cucumber">
    </div>
  </div>
</section>

<section class="rolls-section wrap" id="rolls">
  <div class="rolls-header">
    <h2>Popular Rolls</h2>
    <div class="rolls-nav">
      <button id="prevBtn" aria-label="Previous">←</button>
      <button id="nextBtn" aria-label="Next">→</button>
    </div>
  </div>

  <div class="rolls-grid" id="rollsGrid"></div>

  <div class="roll-detail" id="rollDetail"></div>
</section>

<footer>
  © 2026 SushiKris. All rights reserved.
</footer>

<script>
  const rolls = [
    {
      name: "Dragon Roll",
      price: 12.50,
      rating: "4.9",
      img: "https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=500&q=80",
      desc: "Eel, cucumber, avocado and unagi sauce on top, finished with sesame seeds."
    },
    {
      name: "Spicy Tuna Roll",
      price: 10.90,
      rating: "4.8",
      img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=500&q=80",
      desc: "Fresh tuna, spicy mayo, cucumber and scallion."
    },
    {
      name: "Salmon Avocado",
      price: 11.90,
      rating: "4.9",
      img: "https://images.unsplash.com/photo-1615361200141-f45040f367be?auto=format&fit=crop&w=500&q=80",
      desc: "Delicate salmon with creamy avocado over steamed rice."
    },
    {
      name: "Rainbow Roll",
      price: 13.50,
      rating: "5.0",
      img: "https://images.unsplash.com/photo-1562158070-8c6459066bd6?auto=format&fit=crop&w=500&q=80",
      desc: "An assortment of salmon, tuna and shrimp over a California roll."
    },
    {
      name: "Ebi Tempura",
      price: 10.50,
      rating: "4.7",
      img: "https://images.unsplash.com/photo-1526318472351-c75fcf070305?auto=format&fit=crop&w=500&q=80",
      desc: "Crispy tempura shrimp, cucumber and unagi sauce."
    },
    {
      name: "Philadelphia Roll",
      price: 9.90,
      rating: "4.8",
      img: "https://images.unsplash.com/photo-1611243705617-6d3dcf8a2fda?auto=format&fit=crop&w=500&q=80",
      desc: "Salmon, cream cheese and cucumber wrapped in soft rice."
    }
  ];

  const grid = document.getElementById('rollsGrid');
  const detail = document.getElementById('rollDetail');
  let visibleStart = 0;
  const perPage = 4;
  let selectedIndex = 0;

  function renderGrid(){
    grid.innerHTML = '';
    const slice = rolls.slice(visibleStart, visibleStart + perPage);
    slice.forEach((roll) => {
      const realIndex = rolls.indexOf(roll);
      const card = document.createElement('div');
      card.className = 'roll-card' + (realIndex === selectedIndex ? ' selected' : '');
      card.innerHTML = `
        <div class="thumb"><img src="${roll.img}" alt="${roll.name}"></div>
        <h3>${roll.name}</h3>
        <div class="price">$${roll.price.toFixed(2)}</div>
      `;
      card.addEventListener('click', () => {
        selectedIndex = realIndex;
        renderGrid();
        renderDetail();
      });
      grid.appendChild(card);
    });
  }

  function renderDetail(){
    const roll = rolls[selectedIndex];
    detail.style.opacity = 0;
    setTimeout(() => {
      detail.innerHTML = `
        <div class="detail-thumb"><img src="${roll.img}" alt="${roll.name}"></div>
        <div>
          <h4>${roll.name}</h4>
          <p>${roll.desc}</p>
        </div>
        <div class="detail-price">$${roll.price.toFixed(2)}</div>
      `;
      detail.style.opacity = 1;
    }, 120);
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    visibleStart = (visibleStart - perPage + rolls.length) % rolls.length;
    renderGrid();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    visibleStart = (visibleStart + perPage) % rolls.length;
    renderGrid();
  });

  renderGrid();
  renderDetail();
</script>

</body>
</html>
